<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kurumsal Doküman Asistanı</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--line:#30363d;--text:#e6edf3;--muted:#8b949e;--acc:#3fb950}
*{box-sizing:border-box}body{margin:0;font:15px/1.55 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:820px;margin:0 auto;padding:32px 20px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 20px}
.bar{display:flex;gap:8px}input{flex:1;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px}
button{padding:12px 18px;border:0;border-radius:10px;background:var(--acc);color:#04130a;font-weight:600;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 20px}.chip{font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);cursor:pointer}
.ans{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;white-space:pre-wrap}
.src{margin-top:10px;font-size:13px;color:var(--muted)}.src b{color:var(--text)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;margin-left:6px}.ok{background:#12351d;color:var(--acc)}.no{background:#3a1d1d;color:#ff7b72}
</style></head><body><div class="wrap">
<h1>Kurumsal Doküman Asistanı</h1>
<p class="sub">Şirket dokümanlarını <b>lokalde</b> sorgular: veri dışarı çıkmaz, her cevap kaynak gösterir, bilgi yoksa uydurmaz.</p>
<div class="bar"><input id="q" placeholder="Örn: Devreden izin en fazla kaç gün olabilir?"><button onclick="ask()">Sor</button></div>
<div class="chips" id="chips"></div><div id="out"></div></div>
<script>
const ex=["7 yıllık çalışanın yıllık izni kaç gün?","Şehir dışında günlük yemek harcırahı ne kadar?","Yangında asansör kullanılır mı?","Hangi günler herkes ofiste?","Şirket araç kiralama limiti nedir?"];
chips.innerHTML=ex.map(e=>`<span class="chip">${e}</span>`).join("");
chips.onclick=e=>{if(e.target.classList.contains("chip")){q.value=e.target.textContent;ask()}};
q.onkeydown=e=>{if(e.key==="Enter")ask()};
async function ask(){out.innerHTML='<div class="ans">Düşünüyorum…</div>';
 const r=await fetch("/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q.value})}).then(r=>r.json());
 const tag=r.grounded?'<span class="tag ok">kaynaklı</span>':'<span class="tag no">dokümanda yok</span>';
 const src=r.sources.map(s=>`<b>${s.source}</b> › ${s.section} <span style="opacity:.6">(mesafe ${s.distance})</span>`).join("<br>");
 out.innerHTML=`<div class="ans">${r.answer.replace(/</g,"&lt;")} ${tag}${src?`<div class="src">${src}</div>`:""}</div>`}
</script></body></html>
